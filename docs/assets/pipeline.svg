<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Vinted Hunter pipeline: plan, search, triage, item pages, vision, identify and specs, rank">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f7b6c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="16" fill="#f6f7f9" stroke="#dde1e8"/>
  <text x="40" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1c2330">How a hunt runs</text>

  <g stroke="#0f7b6c" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="171" y1="140" x2="181" y2="140"/>
    <line x1="341" y1="140" x2="351" y2="140"/>
    <line x1="511" y1="140" x2="521" y2="140"/>
    <line x1="681" y1="140" x2="691" y2="140"/>
    <line x1="851" y1="140" x2="861" y2="140"/>
    <line x1="1021" y1="140" x2="1031" y2="140"/>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <g>
      <rect x="14" y="80" width="152" height="120" rx="12" fill="#ffffff" stroke="#dde1e8"/>
      <circle cx="36" cy="102" r="13" fill="#0f7b6c"/>
      <text x="36" y="107" font-size="13" font-weight="700" fill="#ffffff">1</text>
      <text x="90" y="131" font-size="16" font-weight="700" fill="#1c2330">Plan</text>
      <text x="90" y="153" font-size="11" fill="#5d6676">planner</text>
      <text x="90" y="170" font-size="11" fill="#5d6676">spec keys, queries</text>
    </g>
    <g>
      <rect x="184" y="80" width="152" height="120" rx="12" fill="#ffffff" stroke="#dde1e8"/>
      <circle cx="206" cy="102" r="13" fill="#0f7b6c"/>
      <text x="206" y="107" font-size="13" font-weight="700" fill="#ffffff">2</text>
      <text x="260" y="131" font-size="16" font-weight="700" fill="#1c2330">Search</text>
      <text x="260" y="153" font-size="11" fill="#5d6676">Vinted search</text>
      <text x="260" y="170" font-size="11" fill="#5d6676">price filter</text>
    </g>
    <g>
      <rect x="354" y="80" width="152" height="120" rx="12" fill="#ffffff" stroke="#dde1e8"/>
      <circle cx="376" cy="102" r="13" fill="#0f7b6c"/>
      <text x="376" y="107" font-size="13" font-weight="700" fill="#ffffff">3</text>
      <text x="430" y="131" font-size="16" font-weight="700" fill="#1c2330">Triage</text>
      <text x="430" y="153" font-size="11" fill="#5d6676">relevance filter</text>
      <text x="430" y="170" font-size="11" fill="#5d6676">MAX_CANDIDATES</text>
    </g>
    <g>
      <rect x="524" y="80" width="152" height="120" rx="12" fill="#ffffff" stroke="#dde1e8"/>
      <circle cx="546" cy="102" r="13" fill="#0f7b6c"/>
      <text x="546" y="107" font-size="13" font-weight="700" fill="#ffffff">4</text>
      <text x="600" y="131" font-size="16" font-weight="700" fill="#1c2330">Item pages</text>
      <text x="600" y="153" font-size="11" fill="#5d6676">live fetch</text>
      <text x="600" y="170" font-size="11" fill="#5d6676">MAX_DETAILED</text>
    </g>
    <g>
      <rect x="694" y="80" width="152" height="120" rx="12" fill="#ffffff" stroke="#dde1e8"/>
      <circle cx="716" cy="102" r="13" fill="#0f7b6c"/>
      <text x="716" y="107" font-size="13" font-weight="700" fill="#ffffff">5</text>
      <text x="770" y="131" font-size="16" font-weight="700" fill="#1c2330">Vision</text>
      <text x="770" y="153" font-size="11" fill="#5d6676">photos and checks</text>
      <text x="770" y="170" font-size="11" fill="#5d6676">MAX_PHOTOS</text>
    </g>
    <g>
      <rect x="864" y="80" width="152" height="120" rx="12" fill="#ffffff" stroke="#dde1e8"/>
      <circle cx="886" cy="102" r="13" fill="#0f7b6c"/>
      <text x="886" y="107" font-size="13" font-weight="700" fill="#ffffff">6</text>
      <text x="940" y="131" font-size="16" font-weight="700" fill="#1c2330">Identify</text>
      <text x="940" y="153" font-size="11" fill="#5d6676">web lookup</text>
      <text x="940" y="170" font-size="11" fill="#5d6676">specs, new price</text>
    </g>
    <g>
      <rect x="1034" y="80" width="152" height="120" rx="12" fill="#ffffff" stroke="#0f7b6c" stroke-width="2"/>
      <circle cx="1056" cy="102" r="13" fill="#0f7b6c"/>
      <text x="1056" y="107" font-size="13" font-weight="700" fill="#ffffff">7</text>
      <text x="1110" y="131" font-size="16" font-weight="700" fill="#1c2330">Rank</text>
      <text x="1110" y="153" font-size="11" fill="#5d6676">landed price</text>
      <text x="1110" y="170" font-size="11" fill="#5d6676">verdict tiers</text>
    </g>
  </g>

  <text x="40" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5d6676">Search results and web specs are cached. Item pages are always fetched live. Ranking uses the total plus Vinted's default shipping.</text>
</svg>
